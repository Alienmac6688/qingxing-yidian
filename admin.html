<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据变更审计 · 清醒一点</title>
<style>body{margin:0;background:#f4f7fc;color:#172b4d;font:15px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif}main{max-width:1080px;margin:auto;padding:24px}h1{font-size:26px}a{color:#1656ac}header,.panel{background:white;border:1px solid #dce5f2;border-radius:12px;padding:20px;margin-bottom:16px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#60718c}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}button,input,select{padding:10px;border:1px solid #b9c8db;border-radius:8px;background:white;font:inherit}button{cursor:pointer;background:#153c7a;color:white}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #e2e8f0;padding:10px;vertical-align:top}th{color:#54657b}td{overflow-wrap:anywhere}.scroll{overflow-x:auto}.tag{display:inline-block;background:#e9f1ff;border-radius:6px;padding:2px 7px}small{display:block}#error{color:#a32424} @media(max-width:650px){main{padding:12px}td,th{font-size:12px;padding:7px}}</style></head>
<body><main><header><div><h1>数据变更审计</h1><div class="muted">清醒一点 · GitHub 提交与贡献者记录</div></div><a href="./">返回案例库</a></header>
<section class="panel"><strong>记录范围与身份说明</strong><p>本页读取公开仓库 <a href="https://github.com/Alienmac6688/qingxing-yidian/commits/main/" target="_blank" rel="noopener">main 分支提交历史</a>。显示 GitHub 账号（如果有）、提交署名、时间、变更文件和增删行数。<b>提交署名可能由提交者自行设置，不等同于实名认证；一次提交也不一定代表一次上传。</b></p><p class="muted">网页本地 JSON 导入、自建案例及尚未合并的分支/PR，不会自动出现在 main 提交记录里。本页不收集访客身份、不提供隐蔽追踪，也不展示私人访问令牌。</p></section>
<section class="panel"><div class="controls"><input id="filter" placeholder="搜索账号、提交内容、文件名" aria-label="筛选记录"><select id="scope" aria-label="文件范围"><option value="">全部文件</option><option value="data/">仅 data/ 数据文件</option></select><button id="refresh">刷新</button><button id="more">加载更多</button></div><p id="status" class="muted" role="status">正在读取…</p><p id="error" role="alert"></p><div class="scroll"><table><thead><tr><th>提交时间</th><th>GitHub账号 / 提交署名</th><th>变更内容</th><th>文件 / 增删</th><th>证据</th></tr></thead><tbody id="records"></tbody></table></div></section></main>
<script>
(()=>{'use strict';const api='https://api.github.com/repos/Alienmac6688/qingxing-yidian',els=id=>document.getElementById(id);let page=1,commits=[],loading=false,ended=false;const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function get(url){const r=await fetch(url,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub API '+r.status+(r.status===403?'（可能触及未登录访问频率限制）':''));return r.json()}function render(){const q=els('filter').value.toLowerCase(),scope=els('scope').value;const shown=commits.filter(c=>(!scope||c.files.some(f=>f.filename.startsWith(scope)))&&(!q||[c.login,c.name,c.message,...c.files.map(f=>f.filename)].join(' ').toLowerCase().includes(q)));els('records').innerHTML=shown.map(c=>'<tr><td>'+escape(c.date?new Date(c.date).toLocaleString('zh-CN'):'未知')+'</td><td>'+(c.login?'<a href="https://github.com/'+encodeURIComponent(c.login)+'" target="_blank" rel="noopener">'+escape(c.login)+'</a>':'<span class="muted">无关联账号</span>')+'<small>署名：'+escape(c.name||'未知')+'</small></td><td>'+escape(c.message.split('\n')[0])+'</td><td>'+c.files.map(f=>'<small>'+escape(f.filename)+' <span class="muted">+'+Number(f.additions||0)+' / -'+Number(f.deletions||0)+'</span></small>').join('')+'</td><td><a href="'+escape(c.url)+'" target="_blank" rel="noopener">查看提交</a></td></tr>').join('');els('status').textContent='已读取 '+commits.length+' 次提交；当前筛选 '+shown.length+' 次'+(ended?'（已到末页）':'');els('more').disabled=ended||loading}async function load(reset=false){if(loading)return;if(reset){page=1;commits=[];ended=false}loading=true;els('more').disabled=true;els('error').textContent='';els('status').textContent='正在读取 GitHub 提交及文件变更…';try{const list=await get(api+'/commits?sha=main&per_page=20&page='+page);if(!list.length)ended=true;else{const details=await Promise.all(list.map(c=>get(api+'/commits/'+encodeURIComponent(c.sha))));commits.push(...details.map(c=>({sha:c.sha,url:c.html_url,login:c.author?.login||'',name:c.commit?.author?.name||'',date:c.commit?.author?.date||'',message:c.commit?.message||'',files:c.files||[]})));page++;if(list.length<20)ended=true}}catch(e){els('error').textContent='读取失败：'+e.message+'。可直接访问 GitHub 提交历史。'}finally{loading=false;render()}}els('filter').addEventListener('input',render);els('scope').addEventListener('change',render);els('refresh').addEventListener('click',()=>load(true));els('more').addEventListener('click',()=>load());load()})();
</script></body></html>
